all:
  hosts:
    web01:
      ansible_host: private_ec2_ip_address

    web02:
      ansible_host: private_ec2_ip_address
      
    db01:
      ansible_host: private_ec2_ip_address

  children:
    webservers:
      hosts:
        web01:
        web02:

    dbservers:
      hosts:
        db01:

    wd_servers:
      children:
        webservers:
        dbservers:
      vars:
        ansible_user: ec2-user
        ansible_ssh_private_key_file: client-key.pem
      
